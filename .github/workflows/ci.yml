name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install CUE
        shell: pwsh
        run: |
          go install cuelang.org/go/cmd/cue@v0.17.1
          $cueBin = Join-Path (go env GOPATH) "bin"
          $cueBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $cue = Join-Path $cueBin "cue.exe"
          "CUE=$cue" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $cue version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python tools/generate_schemas.py check
      - run: cue vet ./bedrock/... ./example/...
      - name: Vet installed Bedrock data when available
        shell: pwsh
        run: |
          if (Test-Path 'C:\XboxGames\Minecraft for Windows\Content\data') {
            python tools/generate_schemas.py vet-data --cue (Get-Command cue).Source
            python tools/generate_schemas.py collect --ir schema_ir.recollected.json
            if ((Get-FileHash schema_ir.json).Hash -ne (Get-FileHash schema_ir.recollected.json).Hash) { throw 'Recollected schema IR differs' }
          }
